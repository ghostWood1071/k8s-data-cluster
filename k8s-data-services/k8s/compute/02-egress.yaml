apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: spark-egress-allow-all
  namespace: compute          
spec:
  podSelector:
    matchLabels:
      app: spark                        
  policyTypes:
  - Egress
  egress:
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0                 
  - to:
    - ipBlock:
        cidr: ::/0                      
