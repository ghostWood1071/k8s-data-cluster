apiVersion: v1
kind: Service
metadata:
  name: minio-svc
  namespace: storage
spec:
  type: NodePort
  ports:
  - name: cluster
    port: 9000
    protocol: TCP
    targetPort: 9000
    nodePort: 30900
  - name: console
    port: 9001
    protocol: TCP
    targetPort: 9001
    nodePort: 30901
  selector:
    app: minio
  type: ClusterIP