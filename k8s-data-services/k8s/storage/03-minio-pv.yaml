apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-minio-0
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: standard-rwx
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: pd.csi.storage.gke.io
    volumeHandle: projects/your-project/zones/your-zone/disks/minio-csi-0
    fsType: ext4
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-minio-1
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: standard-rwx
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: pd.csi.storage.gke.io
    volumeHandle: projects/your-project/zones/your-zone/disks/minio-csi-1
    fsType: ext4
