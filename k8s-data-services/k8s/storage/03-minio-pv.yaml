apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-minio-0
spec:
  capacity:
    storage: 140Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: hostpath
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /data/minio-0
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-minio-1
spec:
  capacity:
    storage: 140Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: hostpath
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /data/minio-1
