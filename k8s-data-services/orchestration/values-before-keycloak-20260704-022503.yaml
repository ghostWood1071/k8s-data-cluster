airflowVersion: 2.11.0
config:
  core:
    dags_are_paused_at_creation: "True"
    executor: KubernetesExecutor
    load_examples: "False"
  kubernetes:
    namespace: orchestration
  kubernetes_executor:
    deleteWorkerPods: "True"
    namespace: orchestration
  logging:
    remoteLogging: false
  webserver:
    base_url: https://airflow.k8s.tailnet:31662
    enable_proxy_fix: "True"
    proxy_fix_x_for: "1"
    proxy_fix_x_host: "1"
    proxy_fix_x_port: "1"
    proxy_fix_x_proto: "1"
createUserJob:
    enabled: false
dags:
  gitSync:
    branch: master
    enabled: true
    period: 30s
    repo: https://github.com/ghostWood1071/native-data-platform.git
    rev: HEAD
    subPath: orchestration/dags
  persistence:
    accessMode: ReadWriteMany
    enabled: true
    size: 10Gi
    storageClassName: longhorn
data:
  metadataConnection:
    db: airflow
    host: airflow-postgresql.orchestration.svc.cluster.local
    pass: postgres
    port: 5432
    protocol: postgresql
    user: postgres
defaultAirflowRepository: ghostwood/airflow
defaultAirflowTag: 2.0.3
executor: KubernetesExecutor
ingress:
  web:
    annotations:
      nginx.ingress.kubernetes.io/backend-protocol: HTTP
      nginx.ingress.kubernetes.io/proxy-body-size: 100m
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    enabled: true
    hosts:
    - name: airflow.k8s.tailnet
    ingressClassName: nginx
    path: /
    pathType: Prefix
    tls:
      enabled: true
      secretName: airflow-tls
logs:
  persistence:
    enabled: true
    size: 10Gi
    storageClassName: longhorn
migrateDatabaseJob:
  useHelmHooks: false
postgresql:
  auth:
    password: postgres
    username: postgres
  enabled: true
  primary:
    persistence:
      enabled: true
      existingClaim: pvc-airflow-postgres
      size: 8Gi
redis:
  enabled: false
scheduler:
  replicas: 1
  resources:
    requests:
      cpu: 300m
      memory: 1Gi
serviceAccount:
  create: true
  name: airflow-worker
triggerer:
  enabled: true
  persistence:
    enabled: false
webserver:
  defaultUser:
    enabled: false
    password: datalab
    username: admin
  env:
  - name: KEYCLOAK_CLIENT_ID
    valueFrom:
      secretKeyRef:
        key: KEYCLOAK_CLIENT_ID
        name: airflow-keycloak
  - name: KEYCLOAK_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        key: KEYCLOAK_CLIENT_SECRET
        name: airflow-keycloak
  - name: KEYCLOAK_PUBLIC_ISSUER
    value: https://keycloak.k8s.tailnet:31662/realms/company
  - name: KEYCLOAK_INTERNAL_REALM_URL
    value: http://keycloak-service.keycloak.svc.cluster.local:8080/realms/company
  - name: AIRFLOW_PUBLIC_URL
    value: https://airflow.k8s.tailnet:31662
  webserverConfig: |-
    import logging
    import os
    from urllib.parse import urlencode

    import jwt
    from flask import redirect, session
    from flask_appbuilder import expose
    from flask_appbuilder.security.manager import AUTH_OAUTH
    from flask_appbuilder.security.views import AuthOAuthView

    try:
        from airflow.providers.fab.auth_manager.security_manager.override import (
            FabAirflowSecurityManagerOverride,
        )
    except ImportError:
        try:
            from airflow.auth.managers.fab.security_manager.override import (
                FabAirflowSecurityManagerOverride,
            )
        except ImportError:
            from airflow.www.security import (
                AirflowSecurityManager as FabAirflowSecurityManagerOverride,
            )

    log = logging.getLogger(__name__)

    AUTH_TYPE = AUTH_OAUTH
    AUTH_USER_REGISTRATION = True
    AUTH_ROLES_SYNC_AT_LOGIN = True
    AUTH_USER_REGISTRATION_ROLE = "Public"

    AUTH_ROLES_MAPPING = {
        "airflow_admin": ["Admin"],
        "airflow_op": ["Op"],
        "airflow_user": ["User"],
        "airflow_viewer": ["Viewer"],
        "airflow_public": ["Public"],
    }

    PERMANENT_SESSION_LIFETIME = 43200
    WTF_CSRF_ENABLED = True

    CLIENT_ID = os.environ["KEYCLOAK_CLIENT_ID"]
    CLIENT_SECRET = os.environ["KEYCLOAK_CLIENT_SECRET"]
    PUBLIC_ISSUER = os.environ["KEYCLOAK_PUBLIC_ISSUER"].rstrip("/")
    INTERNAL_REALM_URL = os.environ["KEYCLOAK_INTERNAL_REALM_URL"].rstrip("/")
    AIRFLOW_PUBLIC_URL = os.environ["AIRFLOW_PUBLIC_URL"].rstrip("/")

    PUBLIC_OIDC_BASE = f"{PUBLIC_ISSUER}/protocol/openid-connect"
    INTERNAL_OIDC_BASE = f"{INTERNAL_REALM_URL}/protocol/openid-connect"

    OAUTH_PROVIDERS = [
        {
            "name": "keycloak",
            "icon": "fa-key",
            "token_key": "access_token",
            "remote_app": {
                "client_id": CLIENT_ID,
                "client_secret": CLIENT_SECRET,
                "api_base_url": f"{INTERNAL_OIDC_BASE}/",
                "access_token_url": f"{INTERNAL_OIDC_BASE}/token",
                "authorize_url": f"{PUBLIC_OIDC_BASE}/auth",
                "request_token_url": None,
                "client_kwargs": {
                    "scope": "openid email profile",
                    "code_challenge_method": "S256",
                    "response_type": "code",
                },
            },
        }
    ]

    jwks_client = jwt.PyJWKClient(f"{INTERNAL_OIDC_BASE}/certs")

    class KeycloakOAuthView(AuthOAuthView):
        @expose("/logout/", methods=["GET", "POST"])
        def logout(self):
            session.clear()
            query = urlencode(
                {
                    "client_id": CLIENT_ID,
                    "post_logout_redirect_uri": AIRFLOW_PUBLIC_URL,
                }
            )
            return redirect(f"{PUBLIC_OIDC_BASE}/logout?{query}")

    class KeycloakSecurityManager(FabAirflowSecurityManagerOverride):
        authoauthview = KeycloakOAuthView

        def get_oauth_user_info(self, provider, response):
            if provider != "keycloak":
                return {}

            access_token = response.get("access_token")
            if not access_token:
                raise ValueError("Keycloak response does not contain access_token")

            signing_key = jwks_client.get_signing_key_from_jwt(access_token).key
            claims = jwt.decode(
                access_token,
                signing_key,
                algorithms=["RS256"],
                audience=CLIENT_ID,
                issuer=PUBLIC_ISSUER,
                options={"require": ["exp", "iss", "sub"]},
            )

            client_roles = (
                claims.get("resource_access", {})
                .get(CLIENT_ID, {})
                .get("roles", [])
            )

            username = claims.get("preferred_username") or claims["sub"]
            log.info("Keycloak user=%s roles=%s", username, client_roles)

            return {
                "username": username,
                "email": claims.get("email", ""),
                "first_name": claims.get("given_name") or username,
                "last_name": claims.get("family_name") or "",
                "role_keys": client_roles,
            }

    SECURITY_MANAGER_CLASS = KeycloakSecurityManager
worker:
  persistence:
    enabled: false
