apiVersion: v1
kind: ConfigMap
metadata:
  name: openmetadata-callback-proxy
  namespace: openmetadata
data:
  default.conf: |
    server {
      listen 8080;

      location = /healthz {
        return 200 "ok\n";
      }

      location = /callback {
        if ($arg_id_token != "") {
          return 302 https://$host/auth/callback?$args;
        }

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://openmetadata.openmetadata.svc.cluster.local:8585;
      }

      location / {
        return 404;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openmetadata-callback-proxy
  namespace: openmetadata
  labels:
    app.kubernetes.io/name: openmetadata-callback-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openmetadata-callback-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openmetadata-callback-proxy
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: config
          configMap:
            name: openmetadata-callback-proxy
---
apiVersion: v1
kind: Service
metadata:
  name: openmetadata-callback-proxy
  namespace: openmetadata
  labels:
    app.kubernetes.io/name: openmetadata-callback-proxy
spec:
  selector:
    app.kubernetes.io/name: openmetadata-callback-proxy
  ports:
    - name: http
      port: 80
      targetPort: http
