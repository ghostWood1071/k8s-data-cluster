apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-taskmanager
  namespace: cdc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flink-taskmanager
  template:
    metadata:
      labels:
        app: flink-taskmanager
    spec:
      containers:
        - name: taskmanager
          image: ghostwood/flink-mbs:1.0.2
          args: ["taskmanager"]
          env:
            - name: FLINK_PROPERTIES
              value: |
                jobmanager.rpc.address: flink-jobmanager
                taskmanager.numberOfTaskSlots: 2
          ports:
            - containerPort: 6121
            - containerPort: 6122
