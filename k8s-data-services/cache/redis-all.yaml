apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: cache
type: Opaque
stringData:
  REDIS_PASSWORD: "Redis@123456"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: cache
data:
  redis.conf: |
    bind 0.0.0.0
    port 6379
    protected-mode no

    appendonly yes
    appendfilename "appendonly.aof"
    dir /data

    maxmemory-policy noeviction

---
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: cache
spec:
  clusterIP: None
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: cache
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: cache
spec:
  serviceName: redis-headless
  replicas: 1

  selector:
    matchLabels:
      app: redis

  template:
    metadata:
      labels:
        app: redis

    spec:
      containers:
        - name: redis
          image: redis:7
          imagePullPolicy: IfNotPresent

          ports:
            - name: redis
              containerPort: 6379

          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD

          command:
            - sh
            - -c
            - |
              redis-server /etc/redis/redis.conf --requirepass "$REDIS_PASSWORD"

          volumeMounts:
            - name: redis-data
              mountPath: /data

            - name: redis-config
              mountPath: /etc/redis

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a "$REDIS_PASSWORD" ping | grep PONG
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a "$REDIS_PASSWORD" ping | grep PONG
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6

      volumes:
        - name: redis-config
          configMap:
            name: redis-config

  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn
        resources:
          requests:
            storage: 8Gi

---
apiVersion: v1
kind: Pod
metadata:
  name: redis-client
  namespace: cache
spec:
  containers:
    - name: redis-client
      image: redis:7
      imagePullPolicy: IfNotPresent
      command:
        - sleep
        - "360000"
  restartPolicy: Always