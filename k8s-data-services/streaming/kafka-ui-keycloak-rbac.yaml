---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-ui-config
  namespace: streaming
  labels:
    app.kubernetes.io/name: kafka-ui
data:
  application.yml: |
    kafka:
      clusters:
        - name: streaming-cluster
          bootstrapServers: kafka-broker.streaming.svc.cluster.local:9092
          kafkaConnect:
            - name: kafka-connect
              address: http://kafka-connect.streaming.svc.cluster.local:8083

    auth:
      type: OAUTH2
      oauth2:
        client:
          keycloak:
            clientId: kafka-ui
            clientSecret: ${KEYCLOAK_CLIENT_SECRET}
            client-name: Keycloak
            provider: keycloak
            scope: openid
            authorization-grant-type: authorization_code
            issuer-uri: https://keycloak.datalabutehy.com/realms/data-team
            redirect-uri: http://kafka-ui.k8s.tailnet:30296/login/oauth2/code/keycloak
            user-name-attribute: preferred_username
            custom-params:
              type: oauth
              roles-field: roles

    rbac:
      roles:
        - name: kafka-viewer
          clusters:
            - streaming-cluster
          subjects:
            - provider: oauth
              type: role
              value: kafka-viewer
          permissions:
            - resource: applicationconfig
              actions:
                - view
            - resource: clusterconfig
              actions:
                - view
            - resource: topic
              value: ".*"
              actions:
                - view
                - messages_read
                - analysis_view
            - resource: consumer
              value: ".*"
              actions:
                - view
            - resource: connect
              value: ".*"
              actions:
                - view
            - resource: connector
              value: ".*"
              actions:
                - view
            - resource: acl
              actions:
                - view

        - name: kafka-operator
          clusters:
            - streaming-cluster
          subjects:
            - provider: oauth
              type: role
              value: kafka-operator
          permissions:
            - resource: applicationconfig
              actions:
                - view
            - resource: clusterconfig
              actions:
                - view
            - resource: topic
              value: ".*"
              actions:
                - view
                - create
                - edit
                - messages_read
                - messages_produce
                - messages_delete
                - analysis_run
                - analysis_view
            - resource: consumer
              value: ".*"
              actions:
                - view
                - delete
                - reset_offsets
            - resource: connect
              value: ".*"
              actions:
                - view
                - create
                - edit
                - delete
                - operate
                - reset_offsets
            - resource: connector
              value: ".*"
              actions:
                - view
                - create
                - edit
                - delete
                - operate
                - reset_offsets
            - resource: acl
              actions:
                - view

        - name: kafka-admin
          clusters:
            - streaming-cluster
          subjects:
            - provider: oauth
              type: role
              value: kafka-admin
          permissions:
            - resource: applicationconfig
              actions: all
            - resource: clusterconfig
              actions: all
            - resource: topic
              value: ".*"
              actions: all
            - resource: consumer
              value: ".*"
              actions: all
            - resource: schema
              value: ".*"
              actions: all
            - resource: connect
              value: ".*"
              actions: all
            - resource: connector
              value: ".*"
              actions: all
            - resource: ksql
              actions: all
            - resource: acl
              actions: all
            - resource: audit
              actions: all

    server:
      forward-headers-strategy: framework

    logging:
      level:
        io.kafbat.ui.service.rbac: TRACE
        io.kafbat.ui.service.rbac.extractor: TRACE

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  namespace: streaming
  labels:
    app.kubernetes.io/name: kafka-ui
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-ui
    spec:
      automountServiceAccountToken: false
      hostAliases:
        - ip: 192.168.100.207
          hostnames:
            - keycloak.k8s.tailnet
      containers:
        - name: kafka-ui
          image: ghcr.io/kafbat/kafka-ui:v1.5.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: kafka-ui-keycloak
                  key: client-secret
            - name: SPRING_CONFIG_LOCATION
              value: optional:file:/etc/kafbat/application.yml
          volumeMounts:
            - name: kafka-ui-config
              mountPath: /etc/kafbat
              readOnly: true
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            timeoutSeconds: 3
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 5
            timeoutSeconds: 3
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            timeoutSeconds: 3
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
      volumes:
        - name: kafka-ui-config
          configMap:
            name: kafka-ui-config
            items:
              - key: application.yml
                path: application.yml

---
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
  namespace: streaming
  labels:
    app.kubernetes.io/name: kafka-ui
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kafka-ui
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kafka-ui
  namespace: streaming
  labels:
    app.kubernetes.io/name: kafka-ui
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/proxy-buffer-size: 16k
spec:
  ingressClassName: nginx
  rules:
    - host: kafka-ui.k8s.tailnet
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kafka-ui
                port:
                  number: 8080
