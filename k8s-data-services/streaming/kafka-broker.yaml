# =========================
# Headless Service - Kafka Broker
# =========================
apiVersion: v1
kind: Service
metadata:
  name: kafka-broker
  namespace: streaming
  labels:
    app: kafka-broker
spec:
  clusterIP: None
  selector:
    app: kafka-broker
  ports:
    - name: broker
      port: 9092
      targetPort: 9092

---
# =========================
# StatefulSet - Kafka Broker
# =========================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka-broker
  namespace: streaming
  labels:
    app: kafka-broker
spec:
  serviceName: kafka-broker
  replicas: 1
  selector:
    matchLabels:
      app: kafka-broker
  template:
    metadata:
      labels:
        app: kafka-broker
    spec:
      containers:
        - name: kafka
          image: chiennc4805/kafka-broker:1.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: broker
              containerPort: 9092
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn
        resources:
          requests:
            storage: 2Gi
