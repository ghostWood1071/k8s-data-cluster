# OPTIONAL FILE
# Không apply file này nếu cluster của bạn đang dùng Longhorn dynamic provisioning.
# Các workload chính hiện dùng storageClassName: longhorn.
# File này chỉ giữ lại để tham khảo nếu sau này bạn muốn tự quản lý hostPath PV.

apiVersion: v1
kind: PersistentVolume
metadata:
  name: kafka-controller-pv-0
spec:
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: kafka-controller-storage
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /demo-kafka/data/kafka/controller-0

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: kafka-broker-pv-0
spec:
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: kafka-broker-storage
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /demo-kafka/data/kafka/broker-0

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-streaming-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: postgres-streaming-storage
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /demo-kafka/data/postgres-db
