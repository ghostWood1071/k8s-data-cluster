# =========================
# Headless Service - Kafka Controller
# =========================
apiVersion: v1
kind: Service
metadata:
  name: kafka-controller
  namespace: streaming
  labels:
    app: kafka-controller
spec:
  clusterIP: None
  selector:
    app: kafka-controller
  ports:
    - name: controller
      port: 29093
      targetPort: 29093

---
# =========================
# StatefulSet - Kafka Controller
# =========================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka-controller
  namespace: streaming
  labels:
    app: kafka-controller
spec:
  serviceName: kafka-controller
  replicas: 1
  selector:
    matchLabels:
      app: kafka-controller
  template:
    metadata:
      labels:
        app: kafka-controller
    spec:
      containers:
        - name: kafka
          image: chiennc4805/kafka-controller:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: controller
              containerPort: 29093
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn
        resources:
          requests:
            storage: 2Gi
