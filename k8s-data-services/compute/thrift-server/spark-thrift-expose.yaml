apiVersion: v1
kind: Service
metadata:
  name: spark-thrift-nodeport
  namespace: compute
spec:
  type: NodePort
  selector:
    app: spark-thriftserver
  ports:
    - name: thrift
      protocol: TCP
      port: 10000
      targetPort: 10000
      nodePort: 31000

---
apiVersion: v1
kind: Service
metadata:
  name: spark-ui-nodeport
  namespace: compute
spec:
  type: NodePort
  selector:
    app: spark-thriftserver
  ports:
    - name: thrift
      protocol: TCP
      port: 4040
      targetPort: 4040
      nodePort: 31004