apiVersion: v1
kind: Secret
metadata:
  name: spark-history-minio
  namespace: compute
type: Opaque
stringData:
  MINIO_ACCESS_KEY: minioadmin
  MINIO_SECRET_KEY: minioadmin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-history-server
  namespace: compute
  labels:
    app: spark-history-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-history-server
  template:
    metadata:
      labels:
        app: spark-history-server
    spec:
      serviceAccountName: spark
      containers:
        - name: spark-history-server
          image: ghostwood/spark-engine:1.0.2
          imagePullPolicy: IfNotPresent
          env:
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: spark-history-minio
                  key: MINIO_ACCESS_KEY
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: spark-history-minio
                  key: MINIO_SECRET_KEY
          ports:
            - name: http
              containerPort: 18080
          command:
            - /bin/bash
            - -lc
            - |
              mkdir -p /opt/spark/conf
              cat > /opt/spark/conf/spark-defaults.conf <<EOF
              spark.history.fs.logDirectory s3a://spark-logs/events
              spark.history.ui.port 18080
              spark.history.fs.update.interval 10s
              spark.history.retainedApplications 200
              spark.hadoop.fs.s3a.endpoint http://minio-svc-private.storage.svc.cluster.local:9000
              spark.hadoop.fs.s3a.access.key ${MINIO_ACCESS_KEY}
              spark.hadoop.fs.s3a.secret.key ${MINIO_SECRET_KEY}
              spark.hadoop.fs.s3a.path.style.access true
              spark.hadoop.fs.s3a.impl org.apache.hadoop.fs.s3a.S3AFileSystem
              spark.hadoop.fs.s3a.connection.ssl.enabled false
              EOF

              exec /opt/spark/bin/spark-class org.apache.spark.deploy.history.HistoryServer
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: spark-history-server
  namespace: compute
  labels:
    app: spark-history-server
spec:
  type: ClusterIP
  selector:
    app: spark-history-server
  ports:
    - name: http
      port: 18080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: spark-history-server
  namespace: compute
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: spark-history.datalabutehy.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: spark-history-server
                port:
                  number: 18080
