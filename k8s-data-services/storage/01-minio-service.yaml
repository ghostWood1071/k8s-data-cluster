apiVersion: v1
kind: Service
metadata:
  name: minio-svc-private
  namespace: storage
spec:
  type: ClusterIP
  selector:
    app: minio
  ports:
  - name: api
    port: 9000
    protocol: TCP
    targetPort: 9000
  - name: console
    port: 9001
    protocol: TCP
    targetPort: 9001
---
apiVersion: v1
kind: Service
metadata:
  name: minio-svc-public
  namespace: storage
spec:
  type: NodePort
  selector:
    app: minio
  ports:
  - name: api
    port: 9000
    protocol: TCP
    targetPort: 9000
    nodePort: 30900
  - name: console
    port: 9001
    protocol: TCP
    targetPort: 9001
    nodePort: 30901